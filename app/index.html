<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataTrust & CultureCommons</title>
  <meta name="description" content="Open research infrastructure for culture, history and the arts — with a privacy-first personal data ecosystem." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#b45309" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DataTrust" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#1a1712', paper: '#faf7f0', parchment: '#f3ede0',
            ochre: '#b45309', ochrelite: '#d97706', terra: '#9a3412',
            moss: '#3f6212', indigo: '#3730a3'
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'Times New Roman', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: #faf7f0; color: #1a1712; }
  </style>
</head>
<body>
  <div id="root">
    <p style="font-family: Georgia, serif; text-align: center; padding: 4rem 1rem; color: #57534e;">Loading DataTrust & CultureCommons… if this message stays, please reload the page.</p>
  </div>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
